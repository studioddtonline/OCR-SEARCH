name: Package release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          }
      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned sqlite-vaporetto release
        run: npm run japanese-extension:install
      - name: Verify native extension
        run: npm run japanese-extension:check
      - name: Typecheck
        run: npm run typecheck
      - name: Run regression and integration tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Pack and verify distribution
        shell: bash
        run: |
          npm pack --silent
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          PACKAGE_TARBALL="ocr-search-$PACKAGE_VERSION.tgz"
          tar -tzf "$PACKAGE_TARBALL" > pack-files.txt
          for required in package/dist/index.js package/dist/cli.js package/dist/japanese/worker.mjs package/dist/reviewed.mjs package/NOTICE; do
            grep -Fxq "$required" pack-files.txt || { echo "Packed package is missing $required" >&2; exit 1; }
          done
          echo "PACKAGE_TARBALL=$PACKAGE_TARBALL" >> "$GITHUB_ENV"
      - name: Install tarball and smoke-test package API and CLI
        shell: bash
        run: |
          TEMP_INSTALL="$(mktemp -d)"
          trap 'rm -rf "$TEMP_INSTALL"' EXIT
          npm install --prefix "$TEMP_INSTALL" --no-save "$PWD/$PACKAGE_TARBALL"
          (
          cd "$TEMP_INSTALL"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { DatabaseSync } from "node:sqlite";
          import { OcrSearch } from "ocr-search";
          const database = new DatabaseSync(":memory:");
          database.exec(`
            CREATE TABLE source_images (
              id INTEGER PRIMARY KEY, file_path TEXT, file_name TEXT, ocr_text TEXT, reviewed INTEGER
            );
            CREATE VIRTUAL TABLE images_fts USING fts5(ocr_text, tokenize='trigram');
            INSERT INTO source_images VALUES (1, 'smoke', '001.webp', 'alpha package smoke', 0);
            INSERT INTO images_fts(rowid, ocr_text) VALUES (1, 'alpha package smoke');
          `);
          const search = new OcrSearch({ database });
          const result = await search.search({ query: "alpha", limit: 1 });
          assert.equal(result.results[0]?.id, 1);
          search.close();
          database.close();
          NODE
          ./node_modules/.bin/ocr-search help
          )
      - name: Create GitHub Release and upload npm tarball
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.PACKAGE_TARBALL }}
