name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.16.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned sqlite-vaporetto release
        run: npm run japanese-extension:install
      - name: Verify native extension
        run: npm run japanese-extension:check
      - name: Typecheck
        run: npm run typecheck
      - name: Run regression and integration tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Pack, install, and smoke-test the package
        shell: bash
        run: |
          npm pack --silent
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          PACKAGE_TARBALL="ocr-search-$PACKAGE_VERSION.tgz"
          node .github/scripts/verify-package.mjs "$PACKAGE_TARBALL"
