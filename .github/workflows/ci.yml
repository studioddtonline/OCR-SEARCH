name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.16.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install development dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned sqlite-vaporetto release
        run: npm run japanese-extension:install
      - name: Verify native extension
        run: npm run japanese-extension:check
      - name: Typecheck
        run: npm run typecheck
      - name: Run regression and integration tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Pack, install, and smoke-test the package
        shell: bash
        run: |
          npm pack --silent
          tar -tzf ocr-search-0.1.0.tgz > pack-files.txt
          for required in package/dist/cli.js package/dist/japanese/worker.mjs package/dist/reviewed.mjs package/NOTICE; do
            grep -Fxq "$required" pack-files.txt || { echo "Packed package is missing $required" >&2; exit 1; }
          done
          TEMP_INSTALL="$(mktemp -d)"
          trap 'rm -rf "$TEMP_INSTALL"' EXIT
          npm install --prefix "$TEMP_INSTALL" --no-save "$PWD/ocr-search-0.1.0.tgz"
          (
          cd "$TEMP_INSTALL"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { DatabaseSync } from "node:sqlite";
          import { OcrSearch } from "ocr-search";
          const database = new DatabaseSync(":memory:");
          database.exec(`
            CREATE TABLE source_images (
              id INTEGER PRIMARY KEY, file_path TEXT, file_name TEXT, ocr_text TEXT, reviewed INTEGER
            );
            CREATE VIRTUAL TABLE images_fts USING fts5(ocr_text, tokenize='trigram');
            INSERT INTO source_images VALUES (1, 'smoke', '001.webp', 'alpha package smoke', 0);
            INSERT INTO images_fts(rowid, ocr_text) VALUES (1, 'alpha package smoke');
          `);
          const search = new OcrSearch({ database });
          const result = await search.search({ query: "alpha", limit: 1 });
          assert.equal(result.results[0]?.id, 1);
          search.close();
          database.close();
          NODE
          ./node_modules/.bin/ocr-search help
          )
